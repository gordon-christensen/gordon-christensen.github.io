<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      {% include logo.svg %}
      <div>
        <p class="footer-title">Rutabaga Yoga</p>
        <p class="footer-tag">{{ site.tagline }}</p>
      </div>
    </div>

    <div class="footer-meta">
      <a href="mailto:{{ site.social.email }}">{{ site.social.email }}</a>
    </div>

    <p class="footer-colophon">
      &copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}.
      Set in Fraunces &amp; Spectral. Handmade in a quiet corner of the web.
    </p>
  </div>
</footer>

<script>
  // Nav: solid-on-scroll + mobile toggle
  (function () {
    var header = document.querySelector('[data-nav]');
    var toggle = document.querySelector('[data-nav-toggle]');
    var onScroll = function () {
      if (window.scrollY > 12) header.classList.add('is-scrolled');
      else header.classList.remove('is-scrolled');
    };
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
    if (toggle) toggle.addEventListener('click', function () {
      var open = header.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
