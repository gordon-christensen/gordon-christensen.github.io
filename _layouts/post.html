---
layout: default
---
<article class="post-article">
  <header class="post-header">
    <p class="eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="post-standfirst">{{ page.excerpt_text }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a class="back-link" href="{{ '/writing/' | relative_url }}">&larr; All writing</a>
  </footer>
</article>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  document.querySelectorAll('pre code.language-mermaid').forEach(el => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    el.parentElement.replaceWith(div);
  });
  await mermaid.run();
  let figN = 0;
  document.querySelectorAll('.mermaid').forEach(el => {
    figN++;
    const figure = document.createElement('figure');
    figure.className = 'diagram';
    el.parentNode.insertBefore(figure, el);
    figure.appendChild(el);
    const next = figure.nextElementSibling;
    const cap = document.createElement('figcaption');
    if (next && next.tagName === 'P' && next.textContent.trim().toLowerCase().startsWith('figure:')) {
      const text = next.textContent.replace(/^figure:\s*/i, '');
      cap.innerHTML = `<strong>Figure ${figN}:</strong> ${text}`;
      next.remove();
    } else {
      cap.textContent = `Figure ${figN}`;
    }
    figure.appendChild(cap);
  });
</script>
