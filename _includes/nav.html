<header class="site-header" data-nav>
  <div class="nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Rutabaga Yoga home">
      {% include logo.svg %}
      <span class="brand-word">Rutabaga <span class="brand-word__accent">Yoga</span></span>
    </a>

    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" aria-label="Primary">
      <ul>
        {% for item in site.nav %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url contains item.url %}aria-current="page"{% endif %}>
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
