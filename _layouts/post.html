---
layout: default
---
<article class="post-article">
  <header class="post-header">
    <p class="eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="post-standfirst">{{ page.excerpt_text }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a class="back-link" href="{{ '/writing/' | relative_url }}">&larr; All writing</a>
  </footer>
</article>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  document.querySelectorAll('pre code.language-mermaid').forEach(el => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    el.parentElement.replaceWith(div);
  });
  await mermaid.run();
</script>

<script type="module">
  import { createHyphenator, justifyContent } from 'https://esm.sh/tex-linebreak@0.9.0';
  import enUsPatterns from 'https://esm.sh/hyphenation.en-us';
  await document.fonts.ready;
  const hyphenate = createHyphenator(enUsPatterns);
  const paragraphs = Array.from(document.querySelectorAll('.prose p'));
  justifyContent(paragraphs, hyphenate);
</script>
